name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API — lint, format, OpenAPI, unit and integration tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/api
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: busora_ci
          MYSQL_DATABASE: busora_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pbusora_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.21
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: 1
          MP_SMTP_AUTH_ALLOW_INSECURE: 1
        ports: ['1025:1025', '8025:8025']
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: busora_ci
      # Root, because the migrations create triggers: with binary logging on,
      # MySQL needs SUPER for that, and a service container takes no
      # --log-bin-trust-function-creators flag.
      DB_USER: root
      DB_PASS: busora_ci
      DB_DIALECT: mysql
      MAIL_HOST: 127.0.0.1
      MAIL_PORT: 1025
      MAIL_SECURE: 'false'
      MAIL_USER: noreply@busora.test
      MAIL_PASS: mailpit
      MAILPIT_URL: http://127.0.0.1:8025
      ADMIN_EMAIL: admin@busora.test
      SEED_ADMIN_EMAIL: admin@busora.test
      SEED_MANAGER_EMAIL: manager@busora.test
      # Ticket PDFs render in the runner's Chrome, not a downloaded Chromium
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Generate throwaway secrets
        run: |
          secret() {
            value="$(openssl rand -hex "$2")"
            echo "::add-mask::$value"
            echo "$1=$value" >> "$GITHUB_ENV"
          }
          for name in SESSION_SECRET JWT_SECRET_ACCESS JWT_SECRET_REFRESH \
            MOCK_PAYMENT_SECRET; do
            secret "$name" 32
          done
          # 24 characters: the seeder refuses admin passwords over 32, the
          # most the admin login accepts
          secret SEED_ADMIN_PASSWORD 12
          secret SEED_MANAGER_PASSWORD 12
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run openapi:check
      - run: npm test
      - run: npm run migrate
      - run: npm run seed
      - run: npm run test:integration

  admin:
    name: Admin — lint, format, typecheck, build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npx tsc --noEmit
      # CI=true (set by Actions) makes the CRA build fail on warnings
      - run: npm run build

  web:
    name: Web — lint, format, API types, typecheck, unit tests, build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    env:
      # Playwright runs locally only; CI never needs its browsers
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - name: API types match apps/api/openapi.json
        run: |
          npm run api:types
          git diff --exit-code -- src/lib/api/schema.d.ts
      - run: npm run typecheck
      - run: npm test
      # Needs no running API: all API data loads in the browser
      - run: npm run build
