# Busora local development stack: MySQL + Redis + Mailpit + API.
#
#   docker compose -f infra/docker-compose.dev.yml up -d --build
#   docker compose -f infra/docker-compose.dev.yml exec api npm run migrate
#   docker compose -f infra/docker-compose.dev.yml exec api npm run seed
#
# The API reads apps/api/.env (copy it from .env.example); the overrides below
# point it at the in-network service names. To run the API on the host instead
# (npm run dev in apps/api), start only the services:
#   docker compose -f infra/docker-compose.dev.yml up -d mysql redis mailpit
#
# Dev-only credentials — never reuse them anywhere else.
name: busora-dev

services:
  api:
    build: ../apps/api
    env_file: ../apps/api/.env
    environment:
      NODE_ENV: development
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DIALECT: mysql
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_SECURE: 'false'
      DEV_HTTPS_KEY_PATH: ''
      DEV_HTTPS_CERT_PATH: ''
    ports:
      - '5000:5000'
    volumes:
      # Persist generated ticket PDFs across container rebuilds
      - api_assets:/app/assets/tickets
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      mailpit:
        condition: service_started

  mysql:
    image: mysql:8.0
    # Lets the non-SUPER app user create the passengerRowCount triggers
    command: --log-bin-trust-function-creators=1
    environment:
      MYSQL_ROOT_PASSWORD: busora_root_dev
      MYSQL_DATABASE: busora_dev
      MYSQL_USER: busora
      MYSQL_PASSWORD: busora_dev_password
    ports:
      # 3307 on the host: a local MySQL service may already own 3306
      - '3307:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # Over TCP, so the socket-only server of MySQL's first start doesn't count
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '--protocol=tcp', '-pbusora_root_dev']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  mailpit:
    image: axllent/mailpit:v1.21
    environment:
      # Accept the API's SMTP credentials without a real mail account
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web inbox

volumes:
  api_assets:
  mysql_data:
